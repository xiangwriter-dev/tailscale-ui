name: Desktop checks and installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.artifact }}-1.98.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ matrix.artifact }}-1.98.1-
      - name: Locked dependencies
        run: npm ci
      - name: Frontend checks
        run: |
          npm run check
          npm test
          npm run build
      - name: Rust checks
        shell: bash
        run: |
          set -euo pipefail
          rustup show
          cargo fmt --all --check
          cargo check --workspace --locked
          cargo test --workspace --locked
      - name: Build unsigned test installers
        run: npm run tauri build -- --bundles ${{ matrix.bundles }} -- --locked
      - name: Verify Windows installation and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $packages = @(Get-ChildItem target/release/bundle/nsis -File | Where-Object { $_.Name.EndsWith("_${version}_x64-setup.exe") })
          if ($packages.Count -ne 1) { throw 'Expected one current Windows installer' }
          $workspaceTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $installDir = [IO.Path]::GetFullPath((Join-Path $workspaceTemp 'xiangwriter-install-smoke'))
          if (!$installDir.StartsWith($workspaceTemp + '\', [StringComparison]::OrdinalIgnoreCase) -or (Test-Path -LiteralPath $installDir)) { throw 'Invalid test install directory' }
          $installedExe = Join-Path $installDir 'tailtask-desktop.exe'
          $uninstallExit = $null
          try {
            $install = Start-Process -FilePath $packages[0].FullName -ArgumentList @('/S', ('/D=' + $installDir)) -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0 -or !(Test-Path -LiteralPath $installedExe)) { throw 'Installation failed' }
            $metadata = (Get-Item -LiteralPath $installedExe).VersionInfo
            if ($metadata.ProductVersion -ne $version -or $metadata.ProductName -ne 'xiangwriter远程器') { throw 'Installed product metadata mismatch' }
            node --test scripts/verify-nsis-payload.test.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Payload verifier regression' }
            node scripts/verify-nsis-payload.mjs target/release/tailtask-desktop.exe $installedExe
            if ($LASTEXITCODE -ne 0) { throw 'Installed executable differs from expected NSIS payload' }
          } finally {
            $uninstaller = Join-Path $installDir 'uninstall.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/S', ('_?=' + $installDir)) -WindowStyle Hidden -Wait -PassThru
              $uninstallExit = $uninstall.ExitCode
            }
          }
          if ($uninstallExit -ne 0 -or (Test-Path -LiteralPath $installedExe)) { throw 'Uninstall failed' }
          [PSCustomObject]@{version=$version;installExit=$install.ExitCode;uninstallExit=$uninstallExit;installedExecutableMatchesNsisPayload=$true;installerSha256=(Get-FileHash -LiteralPath $packages[0].FullName).Hash.ToLowerInvariant()} | ConvertTo-Json -Compress
      - name: Collect artifacts and checksums
        run: node scripts/collect-artifacts.mjs ${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiangwriter-0.2.1-${{ matrix.artifact }}-unsigned
          path: release/v0.2.1/*
          if-no-files-found: error
          retention-days: 30
